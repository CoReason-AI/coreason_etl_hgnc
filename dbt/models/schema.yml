version: 2

sources:
  - name: bronze_hgnc
    schema: public
    tables:
      - name: bronze_hgnc_genes_raw

models:
  - name: silver_hgnc_genes
    description: "Silver layer HGNC genes model"
    columns:
      - name: coreason_id
        description: "UUID generated from HGNC ID"
        tests:
          - unique
          - not_null
      - name: hgnc_id
        description: "The primary HGNC ID for the gene."
        tests:
          - unique
          - not_null
      - name: approved_symbol
        description: "The approved symbol for the gene."
        tests:
          - not_null
      - name: approved_name
        description: "The approved name for the gene."
      - name: status
        description: "The status of the gene."
      - name: locus_type
        description: "The locus type of the gene."
      - name: ensembl_id
        description: "The Ensembl ID associated with the gene."
      - name: ncbi_entrez_id
        description: "The NCBI Entrez ID associated with the gene."
      - name: uniprot_ids_raw
        description: "Array of protein IDs associated with the gene."
      - name: omim_ids_raw
        description: "Array of OMIM IDs associated with the gene."
      - name: alias_symbols_raw
        description: "Array of synonyms for the gene."
      - name: prev_symbols_raw
        description: "Array of old symbols for the gene."
      - name: content_hash
        description: "MD5 hash of the raw JSON object."

  - name: gold_hgnc_omim_map
    description: "Gold layer model mapping OMIM IDs to HGNC IDs."
    columns:
      - name: hgnc_id
        description: "The primary HGNC ID for the gene."
        tests:
          - not_null
      - name: omim_id
        description: "The OMIM ID associated with the gene."
        tests:
          - not_null

  - name: gold_hgnc_uniprot_map
    description: "Gold layer model mapping UniProt IDs to HGNC IDs."
    columns:
      - name: hgnc_id
        description: "The primary HGNC ID for the gene."
        tests:
          - not_null
      - name: uniprot_id
        description: "The UniProt ID associated with the gene."
        tests:
          - not_null

  - name: gold_hgnc_synonym_map
    description: "Gold layer model mapping synonyms to HGNC IDs."
    columns:
      - name: hgnc_id
        description: "The primary HGNC ID for the gene."
        tests:
          - not_null
      - name: search_term
        description: "The search term (symbol, alias, or previous symbol)."
        tests:
          - not_null
      - name: term_type
        description: "The type of the search term ('Approved', 'Alias', 'Previous')."
        tests:
          - not_null

  - name: gold_hgnc_master_index
    description: "Gold layer model containing all approved HGNC genes."
    columns:
      - name: coreason_id
        description: "UUID generated from HGNC ID"
        tests:
          - unique
          - not_null
      - name: hgnc_id
        description: "The primary HGNC ID for the gene."
        tests:
          - unique
          - not_null
      - name: approved_symbol
        description: "The approved symbol for the gene."
        tests:
          - not_null
      - name: omim_ids_raw
        description: "Array of OMIM IDs associated with the gene."
